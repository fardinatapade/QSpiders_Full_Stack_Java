<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form's</title>

    <style>
        form {
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="conatiner">

        <!-- 1. 

        Registration Form

            Name        : [____________]

            Email       : [____________]

            Password    : [____________]

            [ Submit ]
         
        -->

        <form action="">

            <label for="Name">Name :</label>
            <input type="text" id="Name" name="name">

            <br>
            <br>

            <label for="Email">Email :</label>
            <input type="email" id="Email" name="email">

            <br>
            <br>

            <label for="Password">Password :</label>
            <input type="password" id="Password" name="password">

            <br>
            <br>
            
            <button>Submit</button>

        </form>


        <!-- 2.

        Gender:

        ( ) Male
        ( ) Female
        ( ) Other

        [ Submit ]
         
        -->

        <form action="">

            <label for="gender">Gender :</label>
            <br>
            <br>
            
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <br>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <br>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

        </form>


        <!-- 3.

        Skills

        ☐ HTML
        ☐ CSS
        ☐ JavaScript
        ☐ Java

        [ Submit ]
         
        -->

        <form action="">

            <label for="skills">Skills :</label>

            <br>
            <br>

            <input type="checkbox" name="language" value="html" id="html">
            <label for="html">HTML</label>
            
            <br>

            <input type="checkbox" name="language" value="css" id="css">
            <label for="css">CSS</label>

            <br>

            <input type="checkbox" name="language" value="javascript" id="js">
            <label for="js">JAVASCRIPT</label>

            <br>

            <input type="checkbox" name="language" value="java" id="java">
            <label for="java">JAVA</label>

            <br>
            <br>

            <button>SUBMIT</button>


        </form>



        <!-- 4.

        Country

        [ Select Country ▼ ]

        Options:
        - India
        - USA
        - UK
        - Canada

        [ Submit ]
         
        -->

        <form action="">

            <label for="country">Country :</label>
            <br>
            <select name="country" id="country">
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
            </select>

            <br>
            <br>

            <button>Submit</button>

        </form>


        <!-- 5.

        Feedback Form

        Message:

        +------------------------+
        |                        |
        |                        |
        |                        |
        |                        |
        +------------------------+

        [ Submit ]
         
        -->

        <form action="">

            <h2>
                Feedback Form
            </h2>

            <label for="msg">Message :</label>
            <br>
            <textarea name="msg" id="msg" rows="4"  cols="30"></textarea>

            <br>
            <br>

            <button>Submit</button>

        </form>


        <!-- 6.

        Upload Resume

        Choose File: [ No file chosen ]

        [ Upload ]

        -->

        <form action="">

            <h1>
                Upload Form
            </h1>

            <label for="choosefile">Choose File :</label>
            <input type="file" id="choosefile">

            <br>
            <br>

            <button>Upload</button>

        </form>


        <!-- 7.

        Login Form

        Username:
        [____________]

        Password:
        [____________]

        ☐ Remember Me

        [ Login ]
        
        -->

        <form action="">

            <h2>
                Login form 
            </h2>

            <label for="username">Username :</label>
            <br>
            <input type="text" id="username" name="username">

            <br>
            <br>

            <label for="password">Password :</label>
            <br>
            <input type="password" id="password" name="password">

            <br>
            <br>

            <input type="checkbox" name="check" id="checkbox" value="rememberme">
            <label for="checkbox">Remeber Me</label>

            <br>
            <br>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
