<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/Test1.css">

    <!-- Jost Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Font-Awesome CDN -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <div class="container">

        <div class="loginbox">

            <!-- Login Form -->

            <div class="form">

                <form action="">
                    <div class="title">
                        <h1>
                            Hello Again 
                        </h1>
                    </div>

                    <div class="info">
                        <p>
                            Let's get started with 30 days streak
                        </p>
                    </div>

                    <div class="inputs">

                        <div class="emailinput">
                            <input type="email"
                            placeholder="EMAIL">
                        </div>

                        <div class="passwordinput">
                            <input type="password"
                            placeholder="PASSWORD">
                        </div>

                    </div>

                    <div class="forgotpass">
                        <a href="">
                            Forgot Password ?
                        </a>
                    </div>

                    <div class="signinbtn">
                        <button>
                            Sign-In
                        </button>
                    </div>

                    <div class="continuewith">
                        <hr>
                        <p>
                            Or Continue With
                        </p>
                    </div>

                    <div class="socialic">
                        <div class="ic">
                            <i class="fa-brands fa-google"></i>
                        </div>

                        <div class="ic">
                            <i class="fa-brands fa-apple"></i>
                        </div>

                        <div class="ic">
                            <i class="fa-brands fa-facebook-f"></i>
                        </div>
                    </div>

                </form>

            </div>

            <!-- Right Side Image -->

            <div class="rightblock">
                <img class="rightsideimg" src="https://images.unsplash.com/photo-1749466389698-1a460185898d?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            </div>

        </div>

    </div>
    
</body>
</html>
