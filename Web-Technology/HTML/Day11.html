<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-11</title>
</head>
<body>

    <div class="container">

        <div class="loginbox" style="margin-top: 50px;">

            <form action="">

                <div class="username">
                    <div class="label">
                        <label for="user">
                            Username : 
                        </label>
                    </div>
                    <div class="input" style="margin-top: 5px;">
                        <input type="text" id="user">
                    </div>
                </div>

                <div class="password" style="margin-top: 10px;">
                    <div class="label">
                        <label for="pass">
                            Password :
                        </label>
                    </div>
                    <div class="input" style="margin-top: 5px;">
                        <input type="password" id="pass">
                    </div>
                </div>

                <div class="button" style="margin-top: 15px;">
                    <button>Login</button>
                </div>

            </form>

        </div>

    </div>
    
</body>
</html>
