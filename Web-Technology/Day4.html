<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-4</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center">

        <div class="content text-center p-3 mt-5 border border-secondary rounded-1 shadow-lg ">

            <div class="boldtag">
                <!-- Bold Tag -->
                <b>Bold Tag</b> <!-- Used to do Bold Texts -->
            </div>

            <div class="strongtag mt-2">
                <!-- Strong Tag -->
                <strong>Strong Tag</strong> <!-- Used to mention this is important texts -->
            </div>

            <!-- Italic Tag -->
            <div class="italictag mt-2">
                <i>Italic tag</i>
            </div>

            <!-- Emphasis Tag -->
            <div class="emphasistag mt-2">
                <em>Emphasis Tag</em>
            </div>

            <!-- Underline Tag -->
            <div class="underlinetag mt-2">
                <u>Underline tag</u>
            </div>

            <!-- Mark Tag -->
            <div class="marktag mt-2">
                <mark>Mark Tag</mark>
            </div>

            <!-- Insert Tag -->
            <div class="instag mt-2">
                <ins>Ins tag</ins>
            </div>


            <!-- Strike Tag -->
            <div class="striketag mt-2">
                <strike>Strike Tag</strike>
            </div>

            <!-- Sup Tag -->
            <div class="suptag mt-2">
                <p>
                    CO
                    <sup>
                        2
                    </sup>
                </p>
            </div>

            <!-- Sub Tag -->
            <div class="subtag mt-2">
                <p>
                    H 
                    <sub>2</sub>
                    O
                </p>
            </div>  

            <!-- Marquee Tag -->
             <div class="marqueetag bg-info fw-semibold">
                <marquee behavior="" direction="">
                    Sale is Live
                </marquee>
             </div>

             <!-- Marquee Tag  Behavior alternate-->
             <div class="marqueetag bg-warning fw-semibold mt-2">
                <marquee behavior="alternate" direction="">
                    Sale is Live
                </marquee>
             </div>

             <!-- Marquee Tag  Direction UP-->
             <div class="marqueetag bg-danger fw-semibold mt-2 text-center">
                <marquee behavior="" direction="up" class="text-center text-white" scrollamount="5">
                    Sale Is Live
                </marquee>  
             </div>

        </div>

    </div>

</body>

</html>
