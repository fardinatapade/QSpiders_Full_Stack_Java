<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Task</title>

    <style>
        table,tr,td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        td {
            padding-left: 60px;
            padding-right: 60px;
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="table">

            <table>
                <thead>
                    <tr>
                        <td rowspan="2">1</td>
                        <td rowspan="2">2</td>
                        <td rowspan="2">3</td>
                        <td rowspan="2">4</td>
                    </tr>

                    <tr>
                        <!-- <td></td>
                        <td></td>
                        <td></td>
                        <td></td> -->
                    </tr>
                </thead>
            </table>

        </div>

    </div>

</body>

</html>
